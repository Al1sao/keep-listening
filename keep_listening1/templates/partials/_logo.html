{% comment %}
    Logo: un vinilo visto desde arriba con una onda de sonido que sale del surco.
    El aro toma los colores del tema que suena (--kl-c1 / --kl-c2) y el brillo
    gira mientras hay música.
{% endcomment %}
<svg class="kl-logo" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
    <defs>
        <linearGradient id="kl-logo-aro{{ sufijo }}" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" class="kl-logo__c1"/>
            <stop offset="1" class="kl-logo__c2"/>
        </linearGradient>
    </defs>
    <circle cx="20" cy="20" r="19" fill="url(#kl-logo-aro{{ sufijo }})"/>
    <circle cx="20" cy="20" r="16.2" fill="#0a0c0b"/>
    <g class="kl-logo__surcos" fill="none" stroke="#fff">
        <circle cx="20" cy="20" r="13.4" stroke-opacity=".1"/>
        <circle cx="20" cy="20" r="10.8" stroke-opacity=".08"/>
        <path class="kl-logo__brillo" d="M8.6 14.2a13 13 0 0 1 6-6" stroke-opacity=".55" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    {# Onda: tres barras que salen de la etiqueta #}
    <g class="kl-logo__onda" fill="url(#kl-logo-aro{{ sufijo }})">
        <rect x="14.4" y="16.6" width="2.2" height="6.8" rx="1.1"/>
        <rect x="18.9" y="13.6" width="2.2" height="12.8" rx="1.1"/>
        <rect x="23.4" y="15.6" width="2.2" height="8.8" rx="1.1"/>
    </g>
</svg>
