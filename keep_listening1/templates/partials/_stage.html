<aside class="kl-stage" id="kl-stage" aria-label="Reproducción en curso">
    <button class="kl-stage__lienzo" type="button" data-abrir-estudio aria-label="Ver la portada en grande">
        <canvas id="kl-hero-canvas" aria-hidden="true"></canvas>
        <span class="kl-vinilo-css" id="kl-vinilo-css" hidden>
            <span class="kl-vinilo-css__disco"></span>
        </span>
    </button>
    <div class="kl-stage__info">
        <p class="kl-eyebrow">Ahora</p>
        <h2 id="kl-stage-titulo">Nada en reproducción</h2>
        <p id="kl-stage-artista">Elegí un tema y el vinilo lo sigue desde acá.</p>
        <div class="kl-stage__acciones">
            <button class="kl-btn kl-btn--sm" type="button" data-estudio-play>
                <i aria-hidden="true" class="bi bi-play-fill"></i> Play
            </button>
            <button class="kl-btn kl-btn--fantasma kl-btn--sm kl-stage__radio" type="button" data-radio>
                <i aria-hidden="true" class="bi bi-broadcast"></i> Radio
            </button>
            <button class="kl-btn kl-btn--fantasma kl-btn--sm" type="button" data-abrir-letra aria-label="Ver la letra">
                <i aria-hidden="true" class="bi bi-chat-quote"></i>
            </button>
            <button class="kl-btn kl-btn--fantasma kl-btn--sm" type="button" data-abrir-estudio aria-label="Ver la portada en grande">
                <i aria-hidden="true" class="bi bi-arrows-fullscreen"></i>
            </button>
        </div>
    </div>
</aside>
