{% comment %}
    Pasos de la compra como pistas de un lado A: la púa marca dónde estás.
    Parámetro: paso (1, 2 o 3).
{% endcomment %}
<ol class="kl-pasos" style="--paso: {{ paso }};" aria-label="Pasos de la compra">
    <li class="{% if paso >= 1 %}hecho{% endif %}" {% if paso == 1 %}aria-current="step"{% endif %}><span>A1</span> Bolsa</li>
    <li class="{% if paso >= 2 %}hecho{% endif %}" {% if paso == 2 %}aria-current="step"{% endif %}><span>A2</span> Pago</li>
    <li class="{% if paso >= 3 %}hecho{% endif %}" {% if paso == 3 %}aria-current="step"{% endif %}><span>A3</span> Listo</li>
</ol>
